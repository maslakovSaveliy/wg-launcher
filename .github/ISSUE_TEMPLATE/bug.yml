name: Bug report
description: Something in wg-launcher does not work as documented.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Use the private report link on the issue chooser, or see
        [SECURITY.md](https://github.com/maslakovSaveliy/wg-launcher/blob/main/SECURITY.md).

        Report only what you observed. If you did not test something, say so.
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: One or two sentences.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: wg-launcher version or commit
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: macOS 15.1 arm64
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, personal file paths and other private data before pasting.
      render: text
