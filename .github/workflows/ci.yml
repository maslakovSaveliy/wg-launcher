name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether the change touches more than Markdown. The test jobs below run only when it does; `quality` always
  # runs, so a docs-only change is still linted (docs:lint) and checked for machine paths (owner decision, 2026-11-02).
  # Anything uncertain (a new branch, a diff that cannot be computed, an empty diff) counts as code: everything runs.
  changes:
    name: Changed files (docs only or code)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: classify
        name: Classify the changed files
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          code=true
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            if changed=$(git diff --name-only "$BASE...$HEAD"); then
              printf 'Changed files:\n%s\n' "$changed"
              if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qv '\.md$'; then code=false; fi
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Runs the test jobs: $code"

  quality:
    name: Lint, typecheck, licenses, paths, docs (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the pnpm version from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm licenses:check
      - run: pnpm paths:check
      # Builds the prod and test flavors of apps/desktop; the test hooks must not be in prod.
      - run: pnpm bundle:check
      - run: pnpm docs:lint

  # Proves install and unit tests on these operating systems. It does not prove game compatibility.
  test:
    name: Install and unit tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Runs the progress-lab fixture's own browser tests and the exporter's browser tests in the bundled
  # Chromium. They prove the fixture, the exporter and the storage behavior they check, not game compatibility.
  e2e:
    name: Fixture and exporter browser tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium with system dependencies
        if: runner.os == 'Linux'
        run: pnpm --filter @wg-launcher/fixture-progress-lab exec playwright install --with-deps chromium
      - name: Install Chromium
        if: runner.os != 'Linux'
        run: pnpm --filter @wg-launcher/fixture-progress-lab exec playwright install chromium
      # Only the bundled Chromium: the `chrome` project needs an installed Google Chrome and is local only.
      # The desktop suite runs in its own job below.
      - run: pnpm test:e2e:fixture --project=chromium
      # The exporter's browser tests use the same Playwright and bundled Chromium.
      - run: pnpm test:e2e:exporters
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            fixtures/test-games/progress-lab/playwright-report/
            fixtures/test-games/progress-lab/test-results/
            packages/exporters/playwright-report/
            packages/exporters/test-results/
          retention-days: 7

  # Packages the prod flavor (electron-builder `dir`, no installer) and reads it back with the release check: fuses
  # and app.asar everywhere, Info.plist on macOS. It proves the build on these runners, not the app on real machines
  # (docs/plans/2026-11-03-ci-windows-linux.md).
  package:
    name: Package and release check (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            check: release:check
          - os: windows-latest
            target: win
            check: release:check:win
          - os: ubuntu-latest
            target: linux
            check: release:check:linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wg-launcher/desktop package:${{ matrix.target }}
      - run: pnpm --filter @wg-launcher/desktop ${{ matrix.check }}

  # Builds the desktop app's test flavor and runs its Playwright `_electron` suite. It proves the build and tests,
  # not game compatibility (AGENTS.md honesty rule 3). Windows is non-blocking until the suite has passed there: its
  # failures show in the run but do not fail the pull request.
  desktop-e2e:
    name: Desktop e2e (${{ matrix.os }}), proves the build and tests, not game compatibility
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # electron 45 has no install script: the binary is downloaded on first use, or by this command.
      - name: Download the Electron binary
        run: pnpm --filter @wg-launcher/desktop exec install-electron
      # Electron needs the same system libraries as Chromium, and Xvfb for a display.
      - name: Install system libraries for Chromium
        if: runner.os == 'Linux'
        run: pnpm --filter @wg-launcher/fixture-progress-lab exec playwright install-deps chromium
      # The suite keeps Chromium's sandbox on (`chromiumSandbox: true`); Ubuntu 24.04 restricts the unprivileged
      # user namespaces it needs through AppArmor.
      - name: Allow unprivileged user namespaces for Chromium's sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Desktop e2e (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:e2e:desktop
      - name: Desktop e2e
        if: runner.os != 'Linux'
        run: pnpm test:e2e:desktop
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-playwright-report-${{ matrix.os }}
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          retention-days: 7
